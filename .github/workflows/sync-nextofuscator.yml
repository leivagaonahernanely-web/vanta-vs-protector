name: Sincronizar Ofuscador 4 con la web

# Cada cambio del motor (server/obfuscator) se compila a JavaScript y se copia a
# protegetuscriptlua/backend/lib/nextofuscator. Ese push a main despliega solo en Railway.
on:
  push:
    branches: [main]
    paths: ['server/obfuscator/**', '.github/workflows/sync-nextofuscator.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compilar el motor a JavaScript
        run: |
          set -e
          pnpm exec tsc server/obfuscator/build.ts --ignoreConfig \
            --outDir "$RUNNER_TEMP/nx" --module es2022 --target es2022 \
            --moduleResolution bundler --skipLibCheck --types node --rootDir server/obfuscator
          # Node necesita la extensión .js en los imports relativos
          sed -i -E 's#from "(\./[a-z]+)"#from "\1.js"#g' "$RUNNER_TEMP/nx"/*.js
          node --input-type=module -e "import('$RUNNER_TEMP/nx/build.js').then(m => { const out = m.buildLua('local x = 1\nprint(x)\n', 1); if (!out.code) process.exit(1); console.log('Compilación OK,', out.code.length, 'caracteres'); })"

      - name: Copiar a protegetuscriptlua y subir
        env:
          SYNC_TOKEN: ${{ secrets.WEB_SYNC_TOKEN }}
        run: |
          set -e
          git clone "https://x-access-token:${SYNC_TOKEN}@github.com/leivagaonahernanely-web/protegetuscriptlua.git" "$RUNNER_TEMP/web"
          DEST="$RUNNER_TEMP/web/backend/lib/nextofuscator"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP"/nx/*.js "$DEST"/
          cd "$RUNNER_TEMP/web"
          git config user.name "sync-nextofuscator"
          git config user.email "noreply@github.com"
          git add backend/lib/nextofuscator
          if git diff --cached --quiet; then
            echo "Sin cambios en el motor"
            exit 0
          fi
          git commit -m "Ofuscador 4: sincronizar NextOfuscator desde vanta-vs-protector (${GITHUB_SHA::7})"
          git push origin HEAD:main
